name: Lurnova - Build vLLM + AIBrix Image

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feat/**'
    paths:
      - 'python/aibrix_kvcache/**'
      - 'build/container/Dockerfile.vllm'
      - '.github/workflows/lurnova-build.yaml'
  workflow_dispatch:
    inputs:
      vllm_version:
        description: 'vLLM version to build against'
        required: false
        default: 'v0.19.0'

env:
  REGISTRY: s05k7i7t.c1.gra9.container-registry.ovh.net
  IMAGE_REPO: lurnova-infra
  IMAGE_NAME: vllm-openai

jobs:
  build-and-push:
    name: Build & Push vLLM+AIBrix Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve vLLM version
        id: vllm
        run: |
          VLLM_VERSION="${{ github.event.inputs.vllm_version }}"
          if [ -z "$VLLM_VERSION" ]; then VLLM_VERSION="v0.19.0"; fi
          echo "version=$VLLM_VERSION" >> $GITHUB_OUTPUT

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Harbor registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Extract metadata for Docker images
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,prefix=${{ steps.vllm.outputs.version }}-aibrix-
            type=sha,prefix=${{ steps.vllm.outputs.version }}-aibrix-git-,format=short
          flavor: |
            latest=false

      - name: Build & Push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: build/container/Dockerfile.vllm
          push: true
          platforms: linux/amd64
          build-args: |
            VLLM_VERSION=${{ steps.vllm.outputs.version }}
            AIBRIX_BRANCH=${{ github.ref_name }}
            AIBRIX_REPO=https://github.com/${{ github.repository }}.git
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          # Cache disabled: aibrix_kvcache wheel recompiles every commit
          # (source changes are what we iterate on), so cache gives minimal
          # speedup but cache-to upload adds 5-10 min to each build.
          # cache-from: type=gha
          # cache-to: type=gha,mode=max
